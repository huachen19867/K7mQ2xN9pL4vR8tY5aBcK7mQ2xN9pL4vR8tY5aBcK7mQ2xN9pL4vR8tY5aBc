# Private Base -> explicit public snapshot -> GitHub Pages.
# Secrets: FEISHU_APP_ID, FEISHU_APP_SECRET.
# Variables: FEISHU_BASE_TOKEN, FEISHU_LEAVES_TABLE_ID.
# Reused from huachen-homepage/.publish/.github/workflows/feishu-pages.yml.
# The application requires base:record:read and access to this Base.
name: Sync Feishu leaves and publish Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

concurrency:
  group: feishu-leaves-pages
  cancel-in-progress: false

jobs:
  sync-and-build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read public records from private Base
        run: node scripts/feishu-leaves-sync.mjs
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BASE_TOKEN: ${{ vars.FEISHU_BASE_TOKEN }}
          FEISHU_LEAVES_TABLE_ID: ${{ vars.FEISHU_LEAVES_TABLE_ID }}
          SITE_DIR: '.'
      - name: Retain snapshot without overwriting concurrent edits
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'Main changed during sync. Stop; the next run will read the newest revision.'
            exit 1
          fi
          if ! git diff --quiet -- leaves.json js/leaves-data.js; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- leaves.json js/leaves-data.js
            git commit -m 'Sync public leave records from Feishu'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - name: Package public website only
        shell: bash
        run: |
          mkdir -p _site
          cp index.html my-applications.html leave-form.html admin.html content.json leaves.json _site/
          cp -R assets js _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: sync-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish validated public snapshot
        id: deployment
        uses: actions/deploy-pages@v4
